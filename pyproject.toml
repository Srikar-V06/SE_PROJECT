[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ledger-api"
version = "0.1.0"
description = "Financial ledger and digital wallet API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic[email]>=2",
    "argon2-cffi",
    "uvicorn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger_api = ["db/migrations/*.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"