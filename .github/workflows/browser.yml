name: Wallet browser tests
on: [push, pull_request]
jobs:
  wallet-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser/wallet_browser.py
